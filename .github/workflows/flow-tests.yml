name: Flow tests

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flows-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: flows-code/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline flow tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
