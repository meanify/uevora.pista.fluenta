## REDIS

apiVersion: v1
kind: Service
metadata:
  name: airflow-redis
  namespace: fluenta   
  labels:
    app: airflow
    service: airflow-redis
spec:
  type: NodePort
  ports:
    - port: 6379
      name: http
      nodePort: 31116
  selector:
    app: airflow
    service: airflow-redis

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-redis
  namespace: fluenta 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
      service: airflow-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: airflow
        service: airflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379

---

apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: fluenta
spec:
  template:
    spec:
      containers:
      - name: db-migration
        image: apache/airflow:3.1.3-python3.12
        command: ['airflow', 'db', 'migrate']
        imagePullPolicy: IfNotPresent
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: airflow-secrets
                key: postgres-password
          - name: AIRFLOW__CORE__EXECUTOR
            value: "CeleryExecutor"
          - name: AIRFLOW__CELERY__BROKER_URL
            value: "redis://redis"
          - name: AIRFLOW__CORE__DEFAULT_TIMEZONE
            value: "Europe/Lisbon"
          - name: AIRFLOW__CORE__LOAD_EXAMPLES
            value: "False"
          - name: AIRFLOW__CORE__FERNET_KEY
            valueFrom:
              secretKeyRef:
                name: airflow-secrets
                key: fernet-key
          - name: AIRFLOW__API__AUTH_BACKEND
            value: "airflow.api.auth.backend.deny_all"
          - name: AIRFLOW__CORE__SECURE_MODE
            value: "True"
          - name: GUNICORN_CMD_ARGS
            value: "--log-level WARNING"
          - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
            value: "postgresql://airflow:$(POSTGRES_PASSWORD)@postgres/airflow"
          - name: AIRFLOW__DATABASE__SQL_ALCHEMY_SCHEMA
            value: "public"
      restartPolicy: Never
  backoffLimit: 4

---

apiVersion: v1
kind: Service
metadata:
  name: airflow-web
  namespace: fluenta
  labels:
    app: airflow
    service: airflow-web
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      protocol: TCP
      nodePort: 30115
  selector:
    app: airflow
    service: airflow-web

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-web
  namespace: fluenta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
      service: airflow-web
  template:
    metadata:
      labels:
        app: airflow
        service: airflow-web
    spec:
      containers:
      - image: apache/airflow:3.1.3-python3.12
        name: airflow-web
        command: ["airflow", "api-server"]
        imagePullPolicy: IfNotPresent
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: airflow-secrets
                key: postgres-password
          - name: AIRFLOW_CONFIG
            value: '/opt/airflow/config/airflow.cfg'
          - name: PYTHONPATH
            value: '/opt/airflow/dependencies'
          - name: AIRFLOW__CORE__EXECUTOR
            value: "CeleryExecutor"
          - name: AIRFLOW__CELERY__RESULT_BACKEND
            value: "db+postgresql://airflow:$(POSTGRES_PASSWORD)@airflow-postgres/airflow"
          - name: AIRFLOW__CELERY__BROKER_URL
            value: "redis://airflow-redis:6379"
          - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
            value: "postgresql://airflow:$(POSTGRES_PASSWORD)@airflow-postgres/airflow"
          - name: AIRFLOW__DATABASE__SQL_ALCHEMY_SCHEMA
            value: "public"
          - name: AIRFLOW__CELERY__STALLED_TASK_TIMEOUT
            value: "600"
          - name: AIRFLOW__CORE__DEFAULT_TIMEZONE
            value: "Europe/Lisbon"
          - name: AIRFLOW__CORE__LOAD_EXAMPLES
            value: "False"
          - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
            value: "True"
          - name: AIRFLOW__WEBSERVER__RBAC
            value: "False"
          - name: AIRFLOW__CORE__FERNET_KEY
            valueFrom:
              secretKeyRef:
                name: airflow-secrets
                key: fernet-key
          - name: AIRFLOW__API__AUTH_BACKEND
            value: "airflow.api.auth.backend.deny_all"
          - name: AIRFLOW__CORE__SECURE_MODE
            value: "True"
          - name: GUNICORN_CMD_ARGS
            value: "--log-level 'info'"
          # - name: AIRFLOW_CONN_KUBERNETES_DEFAULT
          #   value: 'kubernetes://?in_cluster=True&kube_config_path=~%2F.kube%2Fconfig&kube_config=kubeconfig+json&namespace=fluenta'
          # - name: AIRFLOW__KUBERNETES__WORKER_SERVICE_ACCOUNT_NAME
          #   value: 'airflow'
          # - name: AIRFLOW__KUBERNETES__NAMESPACE
          #   value: "fluenta"
          - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
            value: 'true'
        ports:
          - containerPort: 8080
        volumeMounts:
          - name: airflow-vol
            mountPath: /opt/airflow
          - name: survey-exports-vol
            mountPath: /home/airflow/survey-exports
      volumes:
        - name: airflow-vol
          persistentVolumeClaim:
            claimName: fluenta-airflow-pvc
        - name: survey-exports-vol
          persistentVolumeClaim:
            claimName: survey-exports-pvc
