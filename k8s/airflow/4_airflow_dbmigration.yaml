
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: fluenta
spec:
  template:
    spec:
      containers:
      - name: db-migration
        image: apache/airflow:3.1.3-python3.12
        command: ['airflow', 'db', 'migrate']
        imagePullPolicy: IfNotPresent
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: airflow-secrets
                key: postgres-password
          - name: AIRFLOW__CORE__EXECUTOR
            value: "CeleryExecutor"
          - name: AIRFLOW__CELERY__BROKER_URL
            value: "redis://redis"
          - name: AIRFLOW__CORE__DEFAULT_TIMEZONE
            value: "Europe/Lisbon"
          - name: AIRFLOW__CORE__LOAD_EXAMPLES
            value: "False"
          - name: AIRFLOW__CORE__FERNET_KEY
            valueFrom:
              secretKeyRef:
                name: airflow-secrets
                key: fernet-key
          - name: AIRFLOW__API__AUTH_BACKEND
            value: "airflow.api.auth.backend.deny_all"
          - name: AIRFLOW__CORE__SECURE_MODE
            value: "True"
          - name: GUNICORN_CMD_ARGS
            value: "--log-level WARNING"
          - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
            value: "postgresql://airflow:$(POSTGRES_PASSWORD)@postgres/airflow"
          - name: AIRFLOW__DATABASE__SQL_ALCHEMY_SCHEMA
            value: "public"
      restartPolicy: Never
  backoffLimit: 4

