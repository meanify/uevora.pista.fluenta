
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
  namespace: fluenta
  labels:
    app: airflow-postgres
    service: airflow-postgres
spec:
  type: NodePort
  ports:
    - port: 5432
      name: http
      nodePort: 31115
  selector:
    app: airflow-postgres
    service: airflow-postgres

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-postgres
  namespace: fluenta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgres
      service: airflow-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: airflow-postgres
        service: airflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:12
          imagePullPolicy: Always
          resources:
            limits:
              memory: "500Mi"
          env:
            - name: POSTGRES_DB
              value: "airflow"
            - name: POSTGRES_USER
              value: "airflow"
            - name: POSTGRES_PASSWORD
              value: "e76a2WzzPVEFba5s2KMO"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: airflow-postgres-vol
              mountPath: /var/lib/postgresql/data
      volumes:
          - name: airflow-postgres-vol
            persistentVolumeClaim:
              claimName: fluenta-airflow-postgres-pvc

---