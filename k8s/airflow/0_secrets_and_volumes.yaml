    storage: 30Gi
  accessModes:
    - ReadWriteMany
  storageClassName: "survey-exports"
  local:
    path: /scratch/dados/fluenta/survey-exports
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - local-node # - orion2.hpc.uevora.pt

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: survey-exports-pvc
  namespace: fluenta
  labels:
    app: airflow
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "survey-exports"
  resources:
    requests:
      storage: 30Gi

---