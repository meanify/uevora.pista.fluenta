# Secrets 

# Volumes

apiVersion: v1
kind: PersistentVolume
metadata:
  name: fluenta-airflow-postgres-pv
  namespace: fluenta
  labels:
    type: local
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: "fluenta-airflow-postgres"
  local:
    path: /scratch/dados/fluenta/airflow-postgres
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - local-node # - orion2.hpc.uevora.pt

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluenta-airflow-postgres-pvc
  namespace: fluenta
  labels:
    app: airflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "fluenta-airflow-postgres"
  resources:
    requests:
      storage: 100Gi

---

