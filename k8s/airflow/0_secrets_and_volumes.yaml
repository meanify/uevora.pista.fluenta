# Secrets
#
# WARNING: the values below are PLACEHOLDERS, not the live credentials.
# Applying this file will OVERWRITE the real Secret with these placeholders
# and break the deployment. Apply the volume definitions on their own, or
# re-create the Secret afterwards. See REAMED.md for the rotation commands.

apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: fluenta
type: Opaque
stringData:
  # Password for the airflow role in the airflow-postgres database.
  # Must match POSTGRES_PASSWORD used when the database was initialised.
  postgres-password: "CHANGEME"
  # Fernet key Airflow uses to encrypt stored Connections and Variables.
  # Generate with: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # Rotating this invalidates every stored Connection password.
  fernet-key: "CHANGEME"

---

# Volumes

apiVersion: v1
kind: PersistentVolume
metadata:
  name: fluenta-airflow-postgres-pv
  namespace: fluenta
  labels:
    type: local
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: "fluenta-airflow-postgres"
  local:
    path: /scratch/dados/fluenta/airflow-postgres
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - local-node # - orion2.hpc.uevora.pt

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluenta-airflow-postgres-pvc
  namespace: fluenta
  labels:
    app: airflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "fluenta-airflow-postgres"
  resources:
    requests:
      storage: 100Gi

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: fluenta-airflow-pv
  namespace: fluenta
  labels:
    type: local
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  storageClassName: "fluenta-airflow"
  local:
    path: /scratch/dados/fluenta/airflow
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - local-node # - orion2.hpc.uevora.pt

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluenta-airflow-pvc
  namespace: fluenta
  labels:
    app: airflow
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "fluenta-airflow"
  resources:
    requests:
      storage: 10Gi

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: survey-exports-pv
  namespace: fluenta
